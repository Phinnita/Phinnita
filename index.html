<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio · ฐานข้อมูลขั้นสูง</title>
<meta name="description" content="รวมผลงานและการบ้านวิชาฐานข้อมูลขั้นสูง">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8f7; --card:#ffffff; --ink:#1f2937; --mute:#6b7280; --line:#e5ebe8;
  --teal:#0f766e; --teal2:#14b8a6; --amber:#f59e0b; --soft:#ecfdf8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Prompt',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
a{color:inherit}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:rgba(246,248,247,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.logo{font-weight:700;font-size:1.15rem;white-space:nowrap}
.logo span{color:var(--teal)}
.meta{font-size:.78rem;color:var(--mute);line-height:1.3}
.nav{margin-left:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;font-size:.85rem;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--mute);transition:.15s}
.nav a:hover,.nav a.on{background:var(--teal);color:#fff}

/* hero */
.hero{max-width:1080px;margin:28px auto 0;padding:0 20px}
.hero .box{position:relative;overflow:hidden;border-radius:28px;padding:48px 44px;color:#fff;
  background:linear-gradient(120deg,#0f3d3a 0%,#0f766e 50%,#14b8a6 85%,#f59e0b 130%)}
.hero .box:after{content:"🐾";position:absolute;right:30px;bottom:-30px;font-size:12rem;opacity:.1;transform:rotate(-18deg)}
.hero small{letter-spacing:3px;font-weight:600;color:#fde68a;font-size:.78rem}
.hero h1{margin:6px 0 4px;font-size:clamp(1.8rem,4.5vw,2.8rem);line-height:1.2}
.hero p{margin:0;max-width:620px;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:.82rem}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:.9rem;padding:10px 18px;border-radius:999px;transition:.15s;border:0;cursor:pointer;font-family:inherit}
.btn.light{background:#fff;color:var(--teal);margin-top:24px}
.btn.light:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}

/* sections */
main{max-width:1080px;margin:0 auto;padding:10px 20px 60px}
section{scroll-margin-top:80px;margin-top:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 32px;box-shadow:0 8px 24px rgba(15,61,58,.05)}
.label{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;color:var(--teal);letter-spacing:2px}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--soft);color:var(--teal);font-weight:700;letter-spacing:0}
h2{margin:8px 0 6px;font-size:1.5rem;line-height:1.35}
.desc{color:#4b5563;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;align-items:start}
.points{margin:0;padding-left:20px;color:#374151}
.points li{margin:4px 0}
.side{background:var(--soft);border-radius:18px;padding:18px 20px}
.side h4{margin:0 0 8px;font-size:.9rem;color:var(--teal)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid #ccfbf1;color:var(--teal)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn.main{background:var(--teal);color:#fff}
.btn.main:hover{background:#0b5f58;transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid #99f6e4}
.btn.ghost:hover{background:var(--soft)}
.btn.off{background:#f3f4f6;color:#9ca3af;pointer-events:none}

/* profile */
.profile{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.avatar{width:110px;height:110px;border-radius:30px;display:grid;place-items:center;font-size:3.2rem;background:linear-gradient(135deg,#ccfbf1,#fef3c7)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.fact{background:var(--soft);border-radius:14px;padding:10px 14px}
.fact b{display:block;font-size:.72rem;color:var(--mute);font-weight:500}
.overview{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
.ov{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;transition:.15s}
.ov:hover{border-color:var(--teal2);transform:translateY(-3px);box-shadow:0 10px 20px rgba(15,118,110,.1)}
.ov .e{font-size:1.6rem}
.ov .t{font-size:.72rem;color:var(--mute);margin-top:4px}
.ov .n{font-weight:600;font-size:.88rem;line-height:1.35}

/* pager */
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.pager a{font-size:.85rem;text-decoration:none;color:var(--mute);padding:6px 10px;border-radius:10px}
.pager a:hover{background:var(--soft);color:var(--teal)}

footer{text-align:center;color:var(--mute);font-size:.8rem;padding:30px 20px 40px}

@media (max-width:820px){
  .grid,.profile{grid-template-columns:1fr}
  .overview{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:1fr 1fr}
  .hero .box{padding:34px 26px}
  .card{padding:24px 20px}
  .meta{display:none}
}
</style>
</head>
<body>

<!-- =====================================================================
     แก้ข้อมูลตรงนี้ที่เดียว แล้วหน้าเว็บจะเปลี่ยนตามทั้งหมด
     ===================================================================== -->
<script>
const SITE = {
  nameTh:  "ชื่อ-นามสกุล ภาษาไทย",
  nameEn:  "FERN",
  sec:     "66/xx",
  id:      "6642450xx",
  course:  "ฐานข้อมูลขั้นสูง (Advanced Database)",
  about:   "หน้านี้รวบรวมการบ้านและผลงานในรายวิชาฐานข้อมูลขั้นสูง ตั้งแต่ Transaction ใน MySQL ไปจนถึงระบบแนะนำสุนัขด้วย Graph Database (Neo4j) เลือกดูงานจากเมนูด้านบนได้เลย",
  homework: [
    {
      emoji: "🔁", title: "Lab Week 2: Transaction, Concurrency & Recovery",
      desc: "ทดลองการทำงานของ Transaction ใน MySQL บน Google Colab ผ่านระบบรายงานข่าวปลอม (Fake News Report)",
      points: ["Dirty Read: เทียบ READ UNCOMMITTED กับ READ COMMITTED", "Atomic Transaction และการ Rollback เมื่อ report ซ้ำ", "Lost Update และการแก้ด้วย Atomic UPDATE", "Benchmark Autocommit vs Explicit Transaction", "Deadlock + Retry แบบ Exponential Backoff และ Redo/Undo Log"],
      tags: ["MySQL", "Python", "Google Colab", "ACID"],
      links: [{ label: "เปิดใน Google Colab", url: "" }]
    },
    {
      emoji: "🕸️", title: "Dog Recommendation Graph ด้วย Neo4j",
      desc: "ออกแบบกราฟผู้เลี้ยง สายพันธุ์ และลักษณะของสุนัข แล้วเขียน Cypher แนะนำสายพันธุ์จากสุนัขที่เพื่อนเลี้ยงและลักษณะที่ตรงกับความต้องการ",
      points: ["ออกแบบ Node 3 ประเภท และ Relationship 4 แบบ", "นับคะแนนจากเพื่อน แล้วตัดพันธุ์ที่เลี้ยงอยู่แล้วออก", "บวกคะแนนจากลักษณะที่ตรงกัน ผลอันดับเปลี่ยนจาก Golden Retriever เป็น Poodle", "บันทึกผลเป็นเส้น RECOMMENDED และทำเป็นฟังก์ชัน Python"],
      tags: ["Neo4j", "Cypher", "Graph Model"],
      links: [{ label: "ดูรายงาน (PDF)", url: "" }]
    },
    {
      emoji: "🐕", title: "Dog Recommendation Graph (NetworkX)",
      desc: "ระบบแนะนำสุนัขด้วยโมเดลกราฟสองฝั่ง (Owner–Breed) เปิดและรันได้บน Google Colab",
      points: ["สร้าง Bipartite Graph และวาดภาพด้วย NetworkX", "หาคนที่ชอบคล้ายกันจาก Neighbor ของกราฟ", "นับเส้นทางด้วย Counter เพื่อจัดอันดับคำแนะนำ", "กรองคำแนะนำด้วยงบค่าเลี้ยงดูและการอยู่คอนโด"],
      tags: ["NetworkX", "Python", "Collaborative Filtering"],
      links: [{ label: "เปิดใน Google Colab", url: "" }]
    },
    {
      emoji: "📊", title: "Dog Neo4j Show Data",
      desc: "เชื่อมต่อ Neo4j Aura จาก Google Colab สร้างข้อมูล แสดงผลเป็นตารางและกราฟ แล้วแนะนำสุนัข 3 แบบ",
      points: ["สร้าง Node และ Relationship ด้วย UNWIND + MERGE", "แสดงข้อมูลเป็นตาราง ตารางไขว้ และกราฟ 3 คอลัมน์", "แนะนำจากคนที่ชอบคล้ายกัน และจากกลุ่มสายพันธุ์เดียวกัน", "Hybrid Recommendation พร้อมตัวกรองคอนโด"],
      tags: ["Neo4j Aura", "Python Driver", "pandas"],
      links: [{ label: "เปิดใน Google Colab", url: "" }]
    },
    {
      emoji: "✨", title: "DogRecommet: ระบบแนะนำสุนัข",
      desc: "เว็บแอปแนะนำสุนัขด้วย Graph Database (Neo4j) สร้างด้วย Streamlit บอกเหตุผลของคำแนะนำได้ทุกครั้ง พร้อมเอกสารอธิบายระบบ",
      points: ["คะแนน = (คนที่ชอบคล้ายกัน × 2) + (กลุ่มเดียวกัน × 1)", "การ์ดคำแนะนำพร้อมรูป อันดับ คะแนน และเหตุผล", "เพิ่ม แก้ไข ลบข้อมูล และ Graph Explorer", "Deploy บน Streamlit Community Cloud"],
      tags: ["Streamlit", "Neo4j Aura", "Web App"],
      links: [
        { label: "เปิดเว็บแอป", url: "https://dogrecommet.streamlit.app" },
        { label: "เอกสารอธิบายระบบ (PDF)", url: "" },
        { label: "Source Code", url: "https://github.com/Phinnita/DogRecommet" }

};
</script>

<header class="top"><div class="in">
  <div><div class="logo">🐶 <span id="nEn"></span></div><div class="meta" id="nMeta"></div></div>
  <nav class="nav" id="nav"></nav>
</div></header>

<div class="hero"><div class="box">
  <small>PORTFOLIO · ADVANCED DATABASE</small>
  <h1 id="hName"></h1>
  <p id="hAbout"></p>
  <div class="chips" id="hChips"></div>
  <a class="btn light" href="#hw1">เริ่มดูผลงาน →</a>
</div></div>

<main id="main"></main>
<footer id="foot"></footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hw = SITE.homework;

$("nEn").textContent = SITE.nameEn;
$("nMeta").textContent = `SEC ${SITE.sec} · ID ${SITE.id}`;
$("hName").textContent = SITE.nameTh;
$("hAbout").textContent = SITE.about;
$("hChips").innerHTML = [`SEC ${SITE.sec}`, `ID ${SITE.id}`, SITE.course].map((t) => `<span class="chip">${esc(t)}</span>`).join("");
$("nav").innerHTML = `<a href="#profile">PROFILE</a>` + hw.map((_, i) => `<a href="#hw${i + 1}">HOMEWORK ${i + 1}</a>`).join("");
$("foot").textContent = `© ${new Date().getFullYear()} ${SITE.nameTh} · ${SITE.course}`;

const sectionIds = ["profile", ...hw.map((_, i) => `hw${i + 1}`)];
const pager = (i) => {
  const prev = i > 0 ? `<a href="#${sectionIds[i - 1]}">← ${i - 1 === 0 ? "PROFILE" : "HOMEWORK " + (i - 1)}</a>` : "<span></span>";
  const next = i < sectionIds.length - 1 ? `<a href="#${sectionIds[i + 1]}">HOMEWORK ${i + 1} →</a>` : `<a href="#profile">↑ กลับด้านบน</a>`;
  return `<div class="pager">${prev}${next}</div>`;
};

let html = `
<section id="profile"><div class="card">
  <span class="label">PROFILE</span>
  <div class="profile" style="margin-top:12px">
    <div class="avatar">🧑‍💻</div>
    <div>
      <h2 style="margin:0">${esc(SITE.nameTh)}</h2>
      <p class="desc" style="margin:4px 0 0">${esc(SITE.course)}</p>
      <div class="facts">
        <div class="fact"><b>เซค</b>${esc(SITE.sec)}</div>
        <div class="fact"><b>รหัสนักศึกษา</b>${esc(SITE.id)}</div>
        <div class="fact"><b>จำนวนผลงาน</b>${hw.length} ชิ้น</div>
      </div>
    </div>
  </div>
  <div class="overview">
    ${hw.map((h, i) => `<a class="ov" href="#hw${i + 1}"><div class="e">${h.emoji}</div><div class="t">HOMEWORK ${i + 1}</div><div class="n">${esc(h.title)}</div></a>`).join("")}
  </div>
  ${pager(0)}
</div></section>`;

hw.forEach((h, i) => {
  const links = h.links.map((l, k) => l.url
    ? `<a class="btn ${k === 0 ? "main" : "ghost"}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`
    : `<span class="btn off">${esc(l.label)} (เร็ว ๆ นี้)</span>`).join("");
  html += `
<section id="hw${i + 1}"><div class="card">
  <span class="label"><span class="num">${i + 1}</span> HOMEWORK ${i + 1}</span>
  <h2>${h.emoji} ${esc(h.title)}</h2>
  <p class="desc">${esc(h.desc)}</p>
  <div class="grid">
    <div><ul class="points">${h.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>
    <div class="side"><h4>เครื่องมือที่ใช้</h4><div class="tags">${h.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
  </div>
  <div class="links">${links}</div>
  ${pager(i + 1)}
</div></section>`;
});
$("main").innerHTML = html;

// highlight current section in nav
const navLinks = [...document.querySelectorAll(".nav a")];
const obs = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (e.isIntersecting) navLinks.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
  });
}, { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("section").forEach((s) => obs.observe(s));
</script>
</body>
</html>
